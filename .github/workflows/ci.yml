# #107 — CI pipeline.
name: CI

# Every "green" claim on this repo was, until now, a local claim on one machine. Both suites were red
# and nobody knew: the backend for 43 commits (#141), the admin for 3 (#143). This workflow is the
# thing that makes green mean something.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite derives its isolated database by suffixing this one's name with `_test`
  # (apps/backend/test/test-db-url.ts), so only the base URL is configured here.
  DATABASE_URL: postgresql://fsm:fsm@localhost:5432/fsm?schema=public

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        # PostGIS is required by migration 20260621140000_add_geography_postgis, and it is a
        # per-database superuser bootstrap (the app role is not a superuser and postgis is not a
        # trusted extension) — so we use the postgis image and create the extension explicitly below.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fsm
          POSTGRES_PASSWORD: fsm
          POSTGRES_DB: fsm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Three databases, each with a single job:
      #   fsm        — the base URL above; nothing runs against it directly
      #   fsm_test   — the e2e suite (global-setup migrates + seeds it, then boots the app)
      #   fsm_drift  — the drift gate ONLY. Never booted, so boot-time DDL (runtime_lock, #130)
      #                cannot pollute the comparison.
      - name: Provision databases
        env:
          PGPASSWORD: fsm
        run: |
          set -euo pipefail
          for db in fsm_test fsm_drift; do
            psql -h localhost -U fsm -d fsm -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db;"
          done
          for db in fsm fsm_test fsm_drift; do
            psql -h localhost -U fsm -d "$db" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          done

      # src/generated/prisma is gitignored, so nothing typechecks or runs without this.
      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx --no-install prisma generate

      # Must precede typecheck AND both suites: apps/backend and apps/admin import `@fsm/shared`
      # through its package exports, which point at packages/shared/dist — and dist/ is gitignored.
      # turbo.json already encodes this as `test: dependsOn ^build`; running the suites directly
      # (below, for unambiguous exit codes) bypasses that, so the dependency is satisfied here.
      - name: Build (shared + backend + admin)
        run: pnpm turbo run build

      # Label corrected 2026-07-28 (#172): `turbo run typecheck` is workspace-wide and has always
      # covered mobile and shared too. The old "(backend + admin)" label gave the wrong answer to
      # "is mobile in CI?" in both directions — typechecked yes, tested no (fixed below).
      - name: Typecheck (all workspaces)
        run: pnpm turbo run typecheck

      # --- #107 AC2: migrate-from-zero + drift gate -------------------------------------------
      # fsm_drift starts empty, so this IS a from-zero migrate. It must succeed, and the resulting
      # schema must then match schema.prisma modulo the committed baseline.
      - name: Migrate from zero
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://fsm:fsm@localhost:5432/fsm_drift?schema=public
        run: npx --no-install prisma migrate deploy

      - name: Schema drift gate
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://fsm:fsm@localhost:5432/fsm_drift?schema=public
        run: node scripts/check-schema-drift.mjs

      # --- #107 AC1/AC6: both suites, in full, on their OWN exit codes ------------------------
      # NEVER pipe these into tail/head/tee. During the 2026-07-22 review `vitest … | tail -60`
      # reported "exit code 0" — that was tail's status, not vitest's, on a suite that was red.
      # `set -o pipefail` is not a substitute: just do not pipe.
      #
      # `if: '!cancelled()'` on all three suite steps (#107, 2026-08-20) — NOT a softening of the
      # gates above, which still fail the job. It exists because of what actually happened: from
      # the day a cosmetic drift line appeared (a renamed index and a `gen_random_uuid()` default)
      # the drift gate failed, every suite step was SKIPPED as a dependent, and the job went red
      # for a reason that had nothing to do with any test. That ran for 106 consecutive red runs
      # in which ZERO tests ever executed — the pipeline written to stop 'both suites were red and
      # nobody knew' was itself running no suites, and nobody knew. A pipeline whose test signal
      # can be switched off entirely by an unrelated earlier step is worth less than the sum of
      # its steps; the suites are the primary product and must report on every run that gets far
      # enough to run them.
      - name: Backend suite
        if: '!cancelled()'
        working-directory: apps/backend
        run: pnpm test

      - name: Admin suite
        if: '!cancelled()'
        working-directory: apps/admin
        run: pnpm test

      # Wave 0 / #107 — `apps/mobile` has a working 6-suite/20-test jest setup that this workflow
      # never invoked, so it could rot silently. That is the exact failure this file was written to
      # kill (see the header): the backend was red for 43 commits and the admin for 3, and nobody
      # knew. Mobile would have been the third instance. The suite is green today (verified
      # 2026-07-28) — this step is what keeps that claim true.
      - name: Mobile suite
        if: '!cancelled()'
        working-directory: apps/mobile
        run: pnpm test

      # --- #107 N3: the admin -> backend HTTP seam, unmocked ----------------------------------
      # Every other admin test mocks `fetch`, so a backend that renames a field, changes a status
      # code or moves a route stays green on BOTH sides and breaks only in a browser. This step boots
      # the real backend and drives it through the admin's own `src/api/client.ts`.
      #
      # It runs against `fsm_test`, which the backend suite above has already migrated and seeded —
      # that is where the `*@fsm.test` fixture credentials the seam logs in with live.
      #
      # VITE_API_URL, not a bespoke variable: it is the exact env var the client itself reads, so the
      # test and the code under test cannot end up pointed at different servers. (An earlier draft used
      # a separate SEAM_API_URL and passed while the client talked to a stale default-port backend.)
      - name: Admin -> backend seam (unmocked HTTP)
        if: '!cancelled()'
        env:
          DATABASE_URL: postgresql://fsm:fsm@localhost:5432/fsm_test?schema=public
          PORT: '3100'
          VITE_API_URL: http://127.0.0.1:3100/api
        run: |
          set -euo pipefail
          node -r dotenv/config apps/backend/dist/main.js &
          backend=$!
          trap 'kill $backend 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/api/health >/dev/null && break
            if ! kill -0 $backend 2>/dev/null; then echo 'backend exited during boot'; exit 1; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3100/api/health >/dev/null || { echo 'backend never became healthy'; exit 1; }
          pnpm --filter @fsm/admin test:seam
